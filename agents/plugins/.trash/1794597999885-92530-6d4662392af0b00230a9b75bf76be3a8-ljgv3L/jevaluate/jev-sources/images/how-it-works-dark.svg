<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1680" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 800 1680"><rect width="800" height="1680" x="0" y="0" fill="#1a1a19" rx="8"/><defs><marker id="ah" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#c3c2b7" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="452" height="170" x="20" y="20" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><circle cx="46" cy="45" r="12" fill="#f0efec"/><text x="46" y="50" fill="#1a1a19" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="68" y="51" fill="#f0efec" font-size="17" font-weight="700">Trigger</text><rect width="62.2" height="22" x="395.8" y="34" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="426.9" y="49.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="82" fill="#f0efec" font-size="16">The reminder hook checks whether your message is</text><text x="34" y="105" fill="#f0efec" font-size="16">about Jev. If it is, the model is told to run jev.py. At</text><text x="34" y="128" fill="#f0efec" font-size="16">most every 2 days, it also starts a background check</text><text x="34" y="151" fill="#f0efec" font-size="16">of TypeSafe&apos;s docs, so the library keeps up with</text><text x="34" y="174" fill="#f0efec" font-size="16">TypeSafe&apos;s dated changes.</text><rect width="268" height="195" x="512" y="20" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><line x1="474" x2="509" y1="105" y2="105" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><text x="526" y="44" fill="#c3c2b7" font-size="13" font-weight="700" letter-spacing=".6">BACKGROUND</text><text x="526" y="68" fill="#f0efec" font-size="16" font-weight="700">Docs check</text><rect width="62.2" height="22" x="703.8" y="52" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="734.9" y="67.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="526" y="95" fill="#f0efec" font-size="15">Each check fetches new or</text><text x="526" y="116" fill="#f0efec" font-size="15">re-dated pages and keeps each</text><text x="526" y="137" fill="#f0efec" font-size="15">page twice: as served, and</text><text x="526" y="158" fill="#f0efec" font-size="15">cleaned of site code. Then it</text><text x="526" y="179" fill="#f0efec" font-size="15">confirms the index matches the</text><text x="526" y="200" fill="#f0efec" font-size="15">pages and reruns the tests.</text><line x1="246" x2="246" y1="192" y2="252" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="127" x="20" y="255" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><circle cx="46" cy="280" r="12" fill="#f0efec"/><text x="46" y="285" fill="#1a1a19" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="68" y="286" fill="#f0efec" font-size="17" font-weight="700">Query expansion</text><rect width="62.2" height="22" x="395.8" y="269" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="426.9" y="284.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="317" fill="#f0efec" font-size="16">jev.py routes the question twice: once in your words,</text><text x="34" y="340" fill="#f0efec" font-size="16">once in the docs&apos; words.</text><text x="34" y="368" fill="#c3c2b7" font-size="14" font-style="italic">The model supplies the docs&apos; words</text><rect width="268" height="195" x="512" y="255" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><line x1="474" x2="509" y1="318.5" y2="318.5" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><text x="526" y="279" fill="#c3c2b7" font-size="13" font-weight="700" letter-spacing=".6">SIDE PATH</text><text x="526" y="303" fill="#f0efec" font-size="16" font-weight="700">Brief guardrail</text><rect width="62.2" height="22" x="703.8" y="287" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="734.9" y="302.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="526" y="330" fill="#f0efec" font-size="15">A subagent brief about Jev is</text><text x="526" y="351" fill="#f0efec" font-size="15">refused until it carries the</text><text x="526" y="372" fill="#f0efec" font-size="15">source-reading line. That way, a</text><text x="526" y="393" fill="#f0efec" font-size="15">subagent can&apos;t hand the main</text><text x="526" y="414" fill="#f0efec" font-size="15">session a Jev answer made up</text><text x="526" y="435" fill="#f0efec" font-size="15">from memory.</text><line x1="246" x2="246" y1="384" y2="487" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="147" x="20" y="490" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><circle cx="46" cy="515" r="12" fill="#f0efec"/><text x="46" y="520" fill="#1a1a19" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="68" y="521" fill="#f0efec" font-size="17" font-weight="700">Keyword retrieval</text><rect width="62.2" height="22" x="395.8" y="504" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="426.9" y="519.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="552" fill="#f0efec" font-size="16">Synonyms widen the question. A topic list adds</text><text x="34" y="575" fill="#f0efec" font-size="16">pages known to answer it. Names like request_id</text><text x="34" y="598" fill="#f0efec" font-size="16">also match their parts. Every section is scored on</text><text x="34" y="621" fill="#f0efec" font-size="16">keyword match, with a boost for reference rules.</text><circle cx="472" cy="534" r="3.5" fill="#898781"/><path fill="none" stroke="#898781" stroke-width="1" d="M475.5,534.0 H504.0"/><line x1="512" x2="512" y1="526" y2="678" stroke="#898781" stroke-linecap="round" stroke-width="2"/><text x="526" y="538" fill="#c3c2b7" font-size="13" font-weight="700">What keyword retrieval catches</text><text x="526" y="566" fill="#c3c2b7" font-size="15" font-style="italic">Catches the docs&apos; own terms.</text><text x="526" y="587" fill="#c3c2b7" font-size="15" font-style="italic">&quot;Can I put 30 passages in one</text><text x="526" y="608" fill="#c3c2b7" font-size="15" font-style="italic">call?&quot; matches the batching</text><text x="526" y="629" fill="#c3c2b7" font-size="15" font-style="italic">topic, which adds the Primitives</text><text x="526" y="650" fill="#c3c2b7" font-size="15" font-style="italic">page&apos;s section &quot;How many</text><text x="526" y="671" fill="#c3c2b7" font-size="15" font-style="italic">questions you can ask&quot;.</text><line x1="246" x2="246" y1="639" y2="716" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="124" x="20" y="719" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><circle cx="46" cy="744" r="12" fill="#f0efec"/><text x="46" y="749" fill="#1a1a19" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="68" y="750" fill="#f0efec" font-size="17" font-weight="700">Semantic retrieval</text><rect width="62.2" height="22" x="395.8" y="733" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="426.9" y="748.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="781" fill="#f0efec" font-size="16">A small local model adds up to two sections that</text><text x="34" y="804" fill="#f0efec" font-size="16">match by meaning. They go after the keyword list</text><text x="34" y="827" fill="#f0efec" font-size="16">and never reorder it. It runs offline.</text><circle cx="472" cy="756" r="3.5" fill="#898781"/><path fill="none" stroke="#898781" stroke-width="1" d="M475.5,756.0 H504.0"/><line x1="512" x2="512" y1="748" y2="921" stroke="#898781" stroke-linecap="round" stroke-width="2"/><text x="526" y="760" fill="#c3c2b7" font-size="13" font-weight="700">What semantic retrieval catches</text><text x="526" y="788" fill="#c3c2b7" font-size="15" font-style="italic">Catches the same idea in other</text><text x="526" y="809" fill="#c3c2b7" font-size="15" font-style="italic">words. A test question asks how</text><text x="526" y="830" fill="#c3c2b7" font-size="15" font-style="italic">the system can &quot;express how</text><text x="526" y="851" fill="#c3c2b7" font-size="15" font-style="italic">sure it is about an answer&quot;</text><text x="526" y="872" fill="#c3c2b7" font-size="15" font-style="italic">without saying confidence;</text><text x="526" y="893" fill="#c3c2b7" font-size="15" font-style="italic">semantic retrieval adds the</text><text x="526" y="914" fill="#c3c2b7" font-size="15" font-style="italic">Confidence page.</text><line x1="246" x2="246" y1="845" y2="959" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="170" x="20" y="962" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><circle cx="46" cy="987" r="12" fill="#f0efec"/><text x="46" y="992" fill="#1a1a19" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="68" y="993" fill="#f0efec" font-size="17" font-weight="700">Classification</text><rect width="62.2" height="22" x="395.8" y="976" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="426.9" y="991.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="1024" fill="#f0efec" font-size="16">Each section is marked READ FULL or EXTRACT,</text><text x="34" y="1047" fill="#f0efec" font-size="16">with its kind: reference rule, pattern, cookbook</text><text x="34" y="1070" fill="#f0efec" font-size="16">example, SDK reference or vendor claim. NEEDS or</text><text x="34" y="1093" fill="#f0efec" font-size="16">EXPERIMENTAL is added from a kept list of</text><text x="34" y="1116" fill="#f0efec" font-size="16">TypeSafe&apos;s stated limits.</text><line x1="246" x2="246" y1="1134" y2="1169" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="147" x="20" y="1172" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><circle cx="46" cy="1197" r="12" fill="#f0efec"/><text x="46" y="1202" fill="#1a1a19" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="68" y="1203" fill="#f0efec" font-size="17" font-weight="700">Context assembly</text><rect width="62.2" height="22" x="395.8" y="1186" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="426.9" y="1201.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="1234" fill="#f0efec" font-size="16">jev.py reads every READ FULL section, reference</text><text x="34" y="1257" fill="#f0efec" font-size="16">rules first, up to a 12,000-token cap. The rest are</text><text x="34" y="1280" fill="#f0efec" font-size="16">listed with read commands, or as a reading plan for</text><text x="34" y="1303" fill="#f0efec" font-size="16">subagents when they total more than the cap.</text><rect width="268" height="132" x="512" y="1172" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><line x1="474" x2="509" y1="1238" y2="1238" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><text x="526" y="1196" fill="#c3c2b7" font-size="13" font-weight="700" letter-spacing=".6">SIDE PATH</text><text x="526" y="1220" fill="#f0efec" font-size="16" font-weight="700">Audit log</text><rect width="62.2" height="22" x="703.8" y="1204" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="734.9" y="1219.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="526" y="1247" fill="#f0efec" font-size="15">Each session&apos;s routed and read</text><text x="526" y="1268" fill="#f0efec" font-size="15">sections are logged on your</text><text x="526" y="1289" fill="#f0efec" font-size="15">machine, for tuning the routes.</text><line x1="246" x2="246" y1="1321" y2="1356" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="124" x="20" y="1359" fill="#1a1a19" stroke="#d95926" stroke-dasharray="7 5" stroke-width="2" rx="6"/><circle cx="46" cy="1384" r="12" fill="#f0efec"/><text x="46" y="1389" fill="#1a1a19" font-size="14" font-weight="700" text-anchor="middle">7</text><text x="68" y="1390" fill="#f0efec" font-size="17" font-weight="700">Answer with provenance</text><rect width="136.8" height="22" x="321.2" y="1373" fill="#1a1a19" stroke="#d95926" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="389.6" y="1388.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="34" y="1421" fill="#f0efec" font-size="16">The model (Claude or Codex) answers in its own</text><text x="34" y="1444" fill="#f0efec" font-size="16">words, citing each section&apos;s source and label. When</text><text x="34" y="1467" fill="#f0efec" font-size="16">the docs don&apos;t settle it, it says &quot;the docs don&apos;t say&quot;.</text><rect width="268" height="195" x="512" y="1359" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="6"/><line x1="474" x2="509" y1="1421" y2="1421" stroke="#c3c2b7" stroke-width="1.5" marker-end="url(#ah)"/><text x="526" y="1383" fill="#c3c2b7" font-size="13" font-weight="700" letter-spacing=".6">SIDE PATH</text><text x="526" y="1407" fill="#f0efec" font-size="16" font-weight="700">Answer check</text><rect width="62.2" height="22" x="703.8" y="1391" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="734.9" y="1406.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="526" y="1434" fill="#f0efec" font-size="15">A hook checks each quote and</text><text x="526" y="1455" fill="#f0efec" font-size="15">citation against its section</text><text x="526" y="1476" fill="#f0efec" font-size="15">before the answer reaches you,</text><text x="526" y="1497" fill="#f0efec" font-size="15">and sends back any that fail.</text><text x="526" y="1518" fill="#f0efec" font-size="15">Subagent findings are checked</text><text x="526" y="1539" fill="#f0efec" font-size="15">too.</text><line x1="20" x2="780" y1="1582" y2="1582" stroke="#2c2c2a" stroke-width="1"/><rect width="62.2" height="22" x="20" y="1598" fill="#1a1a19" stroke="#3987e5" stroke-width="2" rx="4"/><text x="51.1" y="1613.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="168.8" y="1614" fill="#f0efec" font-size="15">Code gives the same result for the same input.</text><rect width="136.8" height="22" x="20" y="1632" fill="#1a1a19" stroke="#d95926" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="88.4" y="1647.5" fill="#f0efec" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="168.8" y="1648" fill="#f0efec" font-size="15">The model follows the instructions in SKILL.md.</text></svg>