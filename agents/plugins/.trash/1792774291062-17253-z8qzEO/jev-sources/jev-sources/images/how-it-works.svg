<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1658" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 800 1658"><rect width="800" height="1658" x="0" y="0" fill="#fcfcfb" rx="8"/><defs><marker id="ah" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#52514e" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="452" height="170" x="20" y="20" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><circle cx="46" cy="45" r="12" fill="#0b0b0b"/><text x="46" y="50" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="68" y="51" fill="#0b0b0b" font-size="17" font-weight="700">Trigger</text><rect width="62.2" height="22" x="395.8" y="34" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="426.9" y="49.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="82" fill="#0b0b0b" font-size="16">The reminder hook checks whether your message is</text><text x="34" y="105" fill="#0b0b0b" font-size="16">about Jev. If it is, the model is told to run jev.py. At</text><text x="34" y="128" fill="#0b0b0b" font-size="16">most every 2 days, it also starts a background check</text><text x="34" y="151" fill="#0b0b0b" font-size="16">of TypeSafe&apos;s docs, so the library keeps up with</text><text x="34" y="174" fill="#0b0b0b" font-size="16">TypeSafe&apos;s dated changes.</text><rect width="268" height="174" x="512" y="20" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><line x1="474" x2="509" y1="105" y2="105" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><text x="526" y="44" fill="#52514e" font-size="13" font-weight="700" letter-spacing=".6">BACKGROUND</text><text x="526" y="68" fill="#0b0b0b" font-size="16" font-weight="700">Page cleaning</text><rect width="62.2" height="22" x="703.8" y="52" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="734.9" y="67.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="526" y="95" fill="#0b0b0b" font-size="15">Each page is kept twice: as</text><text x="526" y="116" fill="#0b0b0b" font-size="15">served, and cleaned of site</text><text x="526" y="137" fill="#0b0b0b" font-size="15">code. Routing reads the clean</text><text x="526" y="158" fill="#0b0b0b" font-size="15">copy; change checks read the</text><text x="526" y="179" fill="#0b0b0b" font-size="15">served one.</text><line x1="246" x2="246" y1="192" y2="231" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="127" x="20" y="234" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><circle cx="46" cy="259" r="12" fill="#0b0b0b"/><text x="46" y="264" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="68" y="265" fill="#0b0b0b" font-size="17" font-weight="700">Query expansion</text><rect width="62.2" height="22" x="395.8" y="248" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="426.9" y="263.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="296" fill="#0b0b0b" font-size="16">jev.py routes the question twice: once in your words,</text><text x="34" y="319" fill="#0b0b0b" font-size="16">once in the docs&apos; words.</text><text x="34" y="347" fill="#52514e" font-size="14" font-style="italic">The model supplies the docs&apos; words</text><rect width="268" height="195" x="512" y="234" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><line x1="474" x2="509" y1="297.5" y2="297.5" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><text x="526" y="258" fill="#52514e" font-size="13" font-weight="700" letter-spacing=".6">SIDE PATH</text><text x="526" y="282" fill="#0b0b0b" font-size="16" font-weight="700">Brief guardrail</text><rect width="62.2" height="22" x="703.8" y="266" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="734.9" y="281.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="526" y="309" fill="#0b0b0b" font-size="15">A subagent brief about Jev is</text><text x="526" y="330" fill="#0b0b0b" font-size="15">refused until it carries the</text><text x="526" y="351" fill="#0b0b0b" font-size="15">source-reading line. That way, a</text><text x="526" y="372" fill="#0b0b0b" font-size="15">subagent can&apos;t hand the main</text><text x="526" y="393" fill="#0b0b0b" font-size="15">session a Jev answer made up</text><text x="526" y="414" fill="#0b0b0b" font-size="15">from memory.</text><line x1="246" x2="246" y1="363" y2="466" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="147" x="20" y="469" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><circle cx="46" cy="494" r="12" fill="#0b0b0b"/><text x="46" y="499" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="68" y="500" fill="#0b0b0b" font-size="17" font-weight="700">Keyword retrieval</text><rect width="62.2" height="22" x="395.8" y="483" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="426.9" y="498.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="531" fill="#0b0b0b" font-size="16">Synonyms widen the question. A topic list adds</text><text x="34" y="554" fill="#0b0b0b" font-size="16">pages known to answer it. Names like request_id</text><text x="34" y="577" fill="#0b0b0b" font-size="16">also match their parts. Every section is scored on</text><text x="34" y="600" fill="#0b0b0b" font-size="16">keyword match, with a boost for reference rules.</text><circle cx="472" cy="513" r="3.5" fill="#898781"/><path fill="none" stroke="#898781" stroke-width="1" d="M475.5,513.0 H504.0"/><line x1="512" x2="512" y1="505" y2="657" stroke="#898781" stroke-linecap="round" stroke-width="2"/><text x="526" y="517" fill="#52514e" font-size="13" font-weight="700">What keyword retrieval catches</text><text x="526" y="545" fill="#52514e" font-size="15" font-style="italic">Catches the docs&apos; own terms.</text><text x="526" y="566" fill="#52514e" font-size="15" font-style="italic">&quot;Can I put 30 passages in one</text><text x="526" y="587" fill="#52514e" font-size="15" font-style="italic">call?&quot; matches the batching</text><text x="526" y="608" fill="#52514e" font-size="15" font-style="italic">topic, which adds the Primitives</text><text x="526" y="629" fill="#52514e" font-size="15" font-style="italic">page&apos;s section &quot;How many</text><text x="526" y="650" fill="#52514e" font-size="15" font-style="italic">questions you can ask&quot;.</text><line x1="246" x2="246" y1="618" y2="695" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="124" x="20" y="698" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><circle cx="46" cy="723" r="12" fill="#0b0b0b"/><text x="46" y="728" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="68" y="729" fill="#0b0b0b" font-size="17" font-weight="700">Semantic retrieval</text><rect width="62.2" height="22" x="395.8" y="712" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="426.9" y="727.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="760" fill="#0b0b0b" font-size="16">A small local model adds up to two sections that</text><text x="34" y="783" fill="#0b0b0b" font-size="16">match by meaning. They go after the keyword list</text><text x="34" y="806" fill="#0b0b0b" font-size="16">and never reorder it. It runs offline.</text><circle cx="472" cy="735" r="3.5" fill="#898781"/><path fill="none" stroke="#898781" stroke-width="1" d="M475.5,735.0 H504.0"/><line x1="512" x2="512" y1="727" y2="900" stroke="#898781" stroke-linecap="round" stroke-width="2"/><text x="526" y="739" fill="#52514e" font-size="13" font-weight="700">What semantic retrieval catches</text><text x="526" y="767" fill="#52514e" font-size="15" font-style="italic">Catches the same idea in other</text><text x="526" y="788" fill="#52514e" font-size="15" font-style="italic">words. A test question asks how</text><text x="526" y="809" fill="#52514e" font-size="15" font-style="italic">the system can &quot;express how</text><text x="526" y="830" fill="#52514e" font-size="15" font-style="italic">sure it is about an answer&quot;</text><text x="526" y="851" fill="#52514e" font-size="15" font-style="italic">without saying confidence;</text><text x="526" y="872" fill="#52514e" font-size="15" font-style="italic">semantic retrieval adds the</text><text x="526" y="893" fill="#52514e" font-size="15" font-style="italic">Confidence page.</text><line x1="246" x2="246" y1="824" y2="938" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="170" x="20" y="941" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><circle cx="46" cy="966" r="12" fill="#0b0b0b"/><text x="46" y="971" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="68" y="972" fill="#0b0b0b" font-size="17" font-weight="700">Classification</text><rect width="62.2" height="22" x="395.8" y="955" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="426.9" y="970.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="1003" fill="#0b0b0b" font-size="16">Each section is marked READ FULL or EXTRACT,</text><text x="34" y="1026" fill="#0b0b0b" font-size="16">with its kind: reference rule, pattern, cookbook</text><text x="34" y="1049" fill="#0b0b0b" font-size="16">example, SDK reference or vendor claim. NEEDS or</text><text x="34" y="1072" fill="#0b0b0b" font-size="16">EXPERIMENTAL is added from a kept list of</text><text x="34" y="1095" fill="#0b0b0b" font-size="16">TypeSafe&apos;s stated limits.</text><line x1="246" x2="246" y1="1113" y2="1148" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="147" x="20" y="1151" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><circle cx="46" cy="1176" r="12" fill="#0b0b0b"/><text x="46" y="1181" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="68" y="1182" fill="#0b0b0b" font-size="17" font-weight="700">Context assembly</text><rect width="62.2" height="22" x="395.8" y="1165" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="426.9" y="1180.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="1213" fill="#0b0b0b" font-size="16">jev.py reads every READ FULL section, reference</text><text x="34" y="1236" fill="#0b0b0b" font-size="16">rules first, up to a 12,000-token cap. The rest are</text><text x="34" y="1259" fill="#0b0b0b" font-size="16">listed with read commands, or as a reading plan for</text><text x="34" y="1282" fill="#0b0b0b" font-size="16">subagents when they total more than the cap.</text><rect width="268" height="132" x="512" y="1151" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><line x1="474" x2="509" y1="1217" y2="1217" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><text x="526" y="1175" fill="#52514e" font-size="13" font-weight="700" letter-spacing=".6">SIDE PATH</text><text x="526" y="1199" fill="#0b0b0b" font-size="16" font-weight="700">Audit log</text><rect width="62.2" height="22" x="703.8" y="1183" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="734.9" y="1198.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="526" y="1226" fill="#0b0b0b" font-size="15">Each session&apos;s routed and read</text><text x="526" y="1247" fill="#0b0b0b" font-size="15">sections are logged on your</text><text x="526" y="1268" fill="#0b0b0b" font-size="15">machine, for tuning the routes.</text><line x1="246" x2="246" y1="1300" y2="1335" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="124" x="20" y="1338" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="7 5" stroke-width="2" rx="6"/><circle cx="46" cy="1363" r="12" fill="#0b0b0b"/><text x="46" y="1368" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">7</text><text x="68" y="1369" fill="#0b0b0b" font-size="17" font-weight="700">Answer with provenance</text><rect width="136.8" height="22" x="321.2" y="1352" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="389.6" y="1367.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="34" y="1400" fill="#0b0b0b" font-size="16">The model (Claude or Codex) quotes the section</text><text x="34" y="1423" fill="#0b0b0b" font-size="16">with its provenance (source path and label). When</text><text x="34" y="1446" fill="#0b0b0b" font-size="16">the docs don&apos;t settle it, it says &quot;the docs don&apos;t say&quot;.</text><rect width="268" height="194" x="512" y="1338" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="7 5" stroke-width="2" rx="6"/><line x1="474" x2="509" y1="1400" y2="1400" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><text x="526" y="1362" fill="#52514e" font-size="13" font-weight="700" letter-spacing=".6">SIDE PATH</text><text x="526" y="1386" fill="#0b0b0b" font-size="16" font-weight="700">Quote</text><text x="526" y="1407" fill="#0b0b0b" font-size="16" font-weight="700">check</text><rect width="136.8" height="22" x="629.2" y="1370" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="697.6" y="1385.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="526" y="1433" fill="#0b0b0b" font-size="15">Before relaying a subagent&apos;s</text><text x="526" y="1454" fill="#0b0b0b" font-size="15">finding, the model checks its</text><text x="526" y="1475" fill="#0b0b0b" font-size="15">quote against the cited section.</text><text x="526" y="1496" fill="#0b0b0b" font-size="15">A quote the check can&apos;t find is</text><text x="526" y="1517" fill="#0b0b0b" font-size="15">relayed as unverified.</text><line x1="20" x2="780" y1="1560" y2="1560" stroke="#e1e0d9" stroke-width="1"/><rect width="62.2" height="22" x="20" y="1576" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="51.1" y="1591.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="168.8" y="1592" fill="#0b0b0b" font-size="15">Code gives the same result for the same input.</text><rect width="136.8" height="22" x="20" y="1610" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="88.4" y="1625.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="168.8" y="1626" fill="#0b0b0b" font-size="15">The model follows the instructions in SKILL.md.</text></svg>