<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1142" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif" viewBox="0 0 800 1142"><rect width="800" height="1142" x="0" y="0" fill="#fcfcfb" rx="8"/><defs><marker id="ah" markerHeight="8" markerWidth="8" orient="auto-start-reverse" refX="9" refY="5" viewBox="0 0 10 10"><path fill="#52514e" d="M0,0 L10,5 L0,10 z"/></marker></defs><rect width="452" height="101" x="20" y="20" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="7 5" stroke-width="2" rx="6"/><circle cx="46" cy="45" r="12" fill="#0b0b0b"/><text x="46" y="50" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">1</text><text x="68" y="51" fill="#0b0b0b" font-size="17" font-weight="700">Start from the rating</text><rect width="136.8" height="22" x="321.2" y="34" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="389.6" y="49.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="34" y="82" fill="#0b0b0b" font-size="16">Claude or Codex reads the rating you agreed with</text><text x="34" y="105" fill="#0b0b0b" font-size="16">and your code at the commit it rated.</text><line x1="246" x2="246" y1="123" y2="158" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="150" x="20" y="161" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><circle cx="46" cy="186" r="12" fill="#0b0b0b"/><text x="46" y="191" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">2</text><text x="68" y="192" fill="#0b0b0b" font-size="17" font-weight="700">Read the docs</text><rect width="62.2" height="22" x="395.8" y="175" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="426.9" y="190.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="223" fill="#0b0b0b" font-size="16">Jev Sources finds the TypeSafe docs and cookbook</text><text x="34" y="246" fill="#0b0b0b" font-size="16">sections behind each fix. Each fix keeps its source</text><text x="34" y="269" fill="#0b0b0b" font-size="16">label; one Claude or Codex can&apos;t quote is dropped.</text><text x="34" y="297" fill="#52514e" font-size="14" font-style="italic">Claude or Codex quotes them</text><line x1="246" x2="246" y1="313" y2="348" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="124" x="20" y="351" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="7 5" stroke-width="2" rx="6"/><circle cx="46" cy="376" r="12" fill="#0b0b0b"/><text x="46" y="381" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">3</text><text x="68" y="382" fill="#0b0b0b" font-size="17" font-weight="700">Check the numbers</text><rect width="136.8" height="22" x="321.2" y="365" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="389.6" y="380.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="34" y="413" fill="#0b0b0b" font-size="16">Only when the project publishes eval results: each</text><text x="34" y="436" fill="#0b0b0b" font-size="16">headline figure gets its sample size, baseline and</text><text x="34" y="459" fill="#0b0b0b" font-size="16">interval.</text><line x1="246" x2="246" y1="477" y2="512" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="124" x="20" y="515" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="7 5" stroke-width="2" rx="6"/><circle cx="46" cy="540" r="12" fill="#0b0b0b"/><text x="46" y="545" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">4</text><text x="68" y="546" fill="#0b0b0b" font-size="17" font-weight="700">Draft</text><rect width="136.8" height="22" x="321.2" y="529" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="389.6" y="544.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="34" y="577" fill="#0b0b0b" font-size="16">Each fix is re-checked at the commit and ranked.</text><text x="34" y="600" fill="#0b0b0b" font-size="16">Each gets five parts: what we saw, why it matters,</text><text x="34" y="623" fill="#0b0b0b" font-size="16">the source, a change to try, how to check it.</text><circle cx="472" cy="552" r="3.5" fill="#898781"/><path fill="none" stroke="#898781" stroke-width="1" d="M475.5,552.0 H504.0"/><line x1="512" x2="512" y1="544" y2="612" stroke="#898781" stroke-linecap="round" stroke-width="2"/><text x="526" y="556" fill="#52514e" font-size="13" font-weight="700">Advice</text><text x="526" y="584" fill="#52514e" font-size="15" font-style="italic">Every fix is a change to try, with</text><text x="526" y="605" fill="#52514e" font-size="15" font-style="italic">a pass line set before the test.</text><line x1="246" x2="246" y1="641" y2="676" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="124" x="20" y="679" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="6"/><circle cx="46" cy="704" r="12" fill="#0b0b0b"/><text x="46" y="709" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">5</text><text x="68" y="710" fill="#0b0b0b" font-size="17" font-weight="700">Checkers</text><rect width="62.2" height="22" x="395.8" y="693" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="426.9" y="708.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="34" y="741" fill="#0b0b0b" font-size="16">Scripts check for the five labels and commit-pinned</text><text x="34" y="764" fill="#0b0b0b" font-size="16">links, and flag promised results, private words and</text><text x="34" y="787" fill="#0b0b0b" font-size="16">quotes not found in the docs or code.</text><line x1="246" x2="246" y1="805" y2="840" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><rect width="452" height="124" x="20" y="843" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="7 5" stroke-width="2" rx="6"/><circle cx="46" cy="868" r="12" fill="#0b0b0b"/><text x="46" y="873" fill="#fcfcfb" font-size="14" font-weight="700" text-anchor="middle">6</text><text x="68" y="874" fill="#0b0b0b" font-size="17" font-weight="700">Review agent</text><rect width="136.8" height="22" x="321.2" y="857" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="389.6" y="872.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="34" y="905" fill="#0b0b0b" font-size="16">One fresh agent checks each docs claim and reads</text><text x="34" y="928" fill="#0b0b0b" font-size="16">the opening as a newcomer would. The checkers</text><text x="34" y="951" fill="#0b0b0b" font-size="16">rerun after any edit.</text><rect width="268" height="173" x="512" y="843" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="7 5" stroke-width="2" rx="6"/><line x1="474" x2="509" y1="905" y2="905" stroke="#52514e" stroke-width="1.5" marker-end="url(#ah)"/><text x="526" y="867" fill="#52514e" font-size="13" font-weight="700" letter-spacing=".6">SIDE PATH</text><text x="526" y="891" fill="#0b0b0b" font-size="16" font-weight="700">Your</text><text x="526" y="912" fill="#0b0b0b" font-size="16" font-weight="700">agents fix</text><rect width="136.8" height="22" x="629.2" y="875" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="697.6" y="890.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="526" y="938" fill="#0b0b0b" font-size="15">You point your coding agents at</text><text x="526" y="959" fill="#0b0b0b" font-size="15">the file. Each runs a fix&apos;s test</text><text x="526" y="980" fill="#0b0b0b" font-size="15">before and after the change;</text><text x="526" y="1001" fill="#0b0b0b" font-size="15">you keep what passes.</text><line x1="20" x2="780" y1="1044" y2="1044" stroke="#e1e0d9" stroke-width="1"/><rect width="62.2" height="22" x="20" y="1060" fill="#fcfcfb" stroke="#2a78d6" stroke-width="2" rx="4"/><text x="51.1" y="1075.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">CODE</text><text x="168.8" y="1076" fill="#0b0b0b" font-size="15">A script does this step.</text><rect width="136.8" height="22" x="20" y="1094" fill="#fcfcfb" stroke="#eb6834" stroke-dasharray="4 3" stroke-width="2" rx="4"/><text x="88.4" y="1109.5" fill="#0b0b0b" font-size="13" font-weight="700" letter-spacing=".6" text-anchor="middle">INSTRUCTIONS</text><text x="168.8" y="1110" fill="#0b0b0b" font-size="15">Claude or Codex follows the steps in SKILL.md.</text></svg>